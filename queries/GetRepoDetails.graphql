# queries/GetRepoDetails.graphql
query GetRepoDetails($owner: String!, $name: String!) {
  repository(owner: $owner, name: $name) {
    nameWithOwner
    description
    repositoryTopics(first: 10) {
      nodes {
        topic {
          name
        }
      }
    }
    readme: object(expression: "HEAD:README.md") {
      ... on Blob {
        byteSize
        text
      }
    }
  }
}